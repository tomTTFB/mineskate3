# Native side of MineSkate 3: the Skate 3 Rust engine's simulation crates
# (SK8-ENGINE/skate-3-rust-engine at cb79689, as adapted for a headless host by
# chasmlol/2010-rust-rewrite-mashup) plus the JNI bridge the mod loads.
[workspace]
members = [
    "crates/skate-core",
    "crates/skate-data",
    "crates/skate-net",
    "crates/skate-host",
    "crates/skate-mc",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1

# Shipped builds: no debug info, symbols stripped.
[profile.dist]
inherits = "release"
debug = 0
strip = true
